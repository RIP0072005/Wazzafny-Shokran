<div class="register-page">
  <div class="container">
    <div class="register-container">
      <div class="register-left">
        <div class="left-content">
          <h2>انضم إلينا اليوم</h2>
          <p>اختر نوع حسابك للبدء في استخدام المنصة</p>
          <div class="perks">
            <div class="perk"><div class="perk-icon">✓</div><span>بناء سيرة ذاتية آلياً </span></div>
            <div class="perk"><div class="perk-icon">✓</div><span>مطابقة ذكية للوظائف </span></div>
            <div class="perk"><div class="perk-icon">✓</div><span>تواصل مباشر مع الشركات </span></div>
          </div>
        </div>
      </div>

      <div class="register-right">
        <div class="form-header">
          <h2>إنشاء حساب جديد</h2>
          <p>أهلاً بك في منصة توظيف الخريجين </p>
        </div>

        <div class="role-selection" style="display: flex; gap: 20px; margin-bottom: 30px;">
          <button 
            type="button"
            class="btn" 
            [class.btn-primary]="userRole === 'graduate'"
            [class.btn-outline-primary]="userRole !== 'graduate'"
            style="flex: 1;" 
            (click)="setRole('graduate')">
            أنا خريج (باحث عن عمل)
          </button>
          
          <button 
            type="button"
            class="btn" 
            [class.btn-primary]="userRole === 'employer'"
            [class.btn-outline-primary]="userRole !== 'employer'"
            style="flex: 1;" 
            (click)="setRole('employer')">
            أنا صاحب عمل (شركة)
          </button>
        </div>

        <form class="register-form" (ngSubmit)="onSubmit()">
          
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" class="form-control" name="fullName" placeholder="أدخل اسمك" [(ngModel)]="userData.name" required>
          </div>

          <div class="form-group mt-3">
            <label>البريد الإلكتروني</label>
            <input type="email" class="form-control" name="email" placeholder="example@domain.com" [(ngModel)]="userData.email" required>
          </div>

          <div class="form-group mt-3">
            <label>كلمة المرور</label>
            <input type="password" class="form-control" name="password" placeholder="أدخل كلمة المرور" [(ngModel)]="userData.password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 20px;">إنشاء الحساب</button>
        </form>
        
      </div>
    </div>
  </div>
</div>
