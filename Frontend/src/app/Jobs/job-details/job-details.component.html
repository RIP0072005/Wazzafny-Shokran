<div class="job-details-page container py-5" *ngIf="job">
  <div class="card p-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="mb-2">{{ job.title }}</h1>
        <p class="text-muted"><i class="fas fa-building"></i> {{ job.companyName }} | <i class="fas fa-map-marker-alt"></i> {{ job.location }}</p>
      </div>
      <span class="badge bg-purple p-2">{{ job.locationType }}</span>
    </div>

    <hr>

    <div class="row">
      <div class="col-md-8">
        <h3>عن الوظيفة</h3>
        <p>{{ job.description }}</p>
        
        <h3>المهارات المطلوبة</h3>
        <p class="bg-light p-3 rounded">{{ job.skills }}</p>
      </div>
      
      <div class="col-md-4">
        <div class="p-3 border rounded text-center">
          <h4 class="mb-3">الراتب المتوقع</h4>
          <h2 class="text-primary mb-4">{{ job.salary | number }} ج.م</h2>
          <button class="btn btn-primary btn-lg w-100" (click)="applyToJob()">قدم الآن</button>
        </div>
      </div>
    </div>
  </div>
</div>
